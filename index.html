
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Fund Calculator</title>
<style>
:root{--bg:#eef0fb;--card:rgba(255,255,255,.82);--tx:#161a2b;--mu:#6b7191;--bd:rgba(120,125,170,.22);--ac:#6366f1;--ac2:#10b981;--in:#f3f4fc;--sh:0 8px 30px rgba(80,90,180,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d17;--card:rgba(26,30,48,.8);--tx:#eef0ff;--mu:#9aa0c4;--bd:rgba(140,150,220,.18);--ac:#8b8ffa;--ac2:#34d399;--in:#12152a;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b0d17;--card:rgba(26,30,48,.8);--tx:#eef0ff;--mu:#9aa0c4;--bd:rgba(140,150,220,.18);--ac:#8b8ffa;--ac2:#34d399;--in:#12152a;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:float 14s ease-in-out infinite;pointer-events:none}
.b1{width:280px;height:280px;background:#818cf8;top:-80px;left:-80px}
.b2{width:260px;height:260px;background:#34d399;bottom:-80px;right:-60px;animation-delay:-6s}
@keyframes float{50%{transform:translate(30px,40px) scale(1.1)}}
.w{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:18px 14px 40px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 16px;animation:up .6s both}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 18px rgba(99,102,241,.45)}
h1{font-size:clamp(18px,5vw,24px);margin:0;letter-spacing:-.3px}
header p{margin:2px 0 0;font-size:12px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:up .6s both}
.card:nth-of-type(2){animation-delay:.08s}.card:nth-of-type(3){animation-delay:.16s}.card:nth-of-type(4){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:8px;font-weight:600;letter-spacing:.4px}
.inp{display:flex;align-items:center;gap:8px;background:#000;border:2px solid #d4af37;border-radius:14px;padding:4px 14px;transition:.2s}
.inp:focus-within{border-color:#ffd24a;box-shadow:0 0 0 4px rgba(212,175,55,.28)}
.inp b{font-size:26px;color:#d4af37}
#fund{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#ffd24a;font-size:clamp(24px,8vw,32px);font-weight:800;padding:8px 0}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--mu);font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.chip:active{transform:scale(.93)}
.tabs{position:relative;display:flex;background:var(--in);border-radius:14px;padding:4px;margin-top:14px}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:11px;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px rgba(99,102,241,.45);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.tabs button{position:relative;flex:1;border:0;background:transparent;color:var(--mu);padding:10px 4px;font-weight:700;font-size:13px;cursor:pointer;transition:color .25s}
.tabs button.on{color:#fff}
.top{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:13;stroke-linecap:round}
.ring .tr{stroke:var(--in)}
.ring .pg{stroke:url(#g);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1s cubic-bezier(.3,.9,.3,1)}
.ring .ct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .ct b{font-size:26px}.ring .ct small{font-size:11px;color:var(--mu)}
.stats{display:grid;gap:8px}
.st{background:var(--in);border-radius:14px;padding:10px 12px}
.st small{display:block;font-size:11px;color:var(--mu);margin-bottom:2px}
.st b{font-size:clamp(16px,4.6vw,20px);font-variant-numeric:tabular-nums}
.st.g b{color:var(--ac2)}
.st{min-width:0}.st b{display:block;overflow-wrap:anywhere}.amt{min-width:0;overflow-wrap:anywhere}
.row{padding:10px 0;border-bottom:1px solid var(--bd);animation:up .45s both;animation-delay:calc(var(--i)*55ms)}
.row:last-child{border:0}
.l1{display:grid;grid-template-columns:auto 82px 1fr;gap:10px;align-items:center}
.badge{font-size:12px;font-weight:800;color:#fff;padding:6px 10px;border-radius:10px;min-width:64px;text-align:center}
.pc{width:82px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:8px;font-size:16px;font-weight:600;outline:0;transition:.2s}
.pc:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.amt{text-align:right;font-weight:800;font-size:clamp(14px,4vw,16px);font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:var(--in);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .8s cubic-bezier(.3,.9,.3,1)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hd h2{font-size:15px;margin:0}
.hd span{font-size:11px;color:var(--mu)}
.note{font-size:12px;color:var(--mu);text-align:center;margin:8px 0 0}
@media (max-width:480px){.w{padding:12px 10px 32px}.card{padding:14px 12px;border-radius:18px}.top{grid-template-columns:1fr;justify-items:center;gap:14px}.ring{width:160px;height:160px}.stats{width:100%;grid-template-columns:1fr 1fr}.st{padding:10px}.tabs button{font-size:12px;padding:11px 2px}.l1{grid-template-columns:auto 76px 1fr;gap:8px}.badge{min-width:58px;padding:7px 8px;font-size:11px}.pc{width:76px}.chip{padding:8px 13px}header p{font-size:11px}.logo{width:38px;height:38px;font-size:19px}}
@media (max-width:350px){.l1{grid-template-columns:auto 68px 1fr;gap:6px}.badge{min-width:52px;font-size:10px;padding:7px 6px}.pc{width:68px;padding:8px 6px}.stats{grid-template-columns:1fr}.tabs button{font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="w">
<header><div class="logo">📊</div><div><h1>Level Fund Calculator</h1><p>Fund daalo, chart turant khul jayega</p></div></header>

<div class="card">
<label for="fund">FUND AMOUNT</label>
<div class="inp"><b>₹</b><input id="fund" type="number" inputmode="decimal" value="10000" autofocus></div>
<div class="chips" id="chips"></div>
<div class="tabs" id="tabs"><div class="pill" id="pill"></div></div>
</div>

<div class="card top">
<div class="ring">
<svg viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs>
<circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" id="pg" cx="60" cy="60" r="52"/></svg>
<div class="ct"><b id="tp">0%</b><small>Used Fund</small></div>
</div>
<div class="stats">
<div class="st"><small>Total Used</small><b id="tu">₹0</b></div>
<div class="st g"><small>Remaining Fund</small><b id="rm">₹0</b></div>
</div>
</div>

<div class="card">
<div class="hd"><h2>Level Breakdown</h2><span id="cnt"></span></div>
<div id="rows"></div>
<p class="note">% box edit karke apna custom level bana sakte ho</p>
</div>
</div>
<script>
var plans=[
{n:"Plan 1 · 8 Levels",p:[0.2,0.3,0.6,1.3,2.6,5.2,10.5,22]},
{n:"Plan 2 · 12 Levels",p:[0.1,0.3,0.7,1.5,0.3,0.7,1.5,4,1,3,7,15]}];
var cur=0,pcts=plans[0].p.slice(),f=document.getElementById('fund');
function inr(n){try{return '₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}catch(e){return '₹'+n}}
function tween(el,to,fm){
var from=el._v||0;el._v=to;var t0=performance.now(),d=600;
cancelAnimationFrame(el._r);
(function s(t){var k=Math.min(1,(t-t0)/d);k=1-Math.pow(1-k,3);el.textContent=fm(from+(to-from)*k);if(k<1)el._r=requestAnimationFrame(s)})(t0)}
function hue(i){return Math.round(250-i*(110/Math.max(pcts.length-1,1)))}
function buildTabs(){
var t=document.getElementById('tabs');
plans.forEach(function(p,i){var b=document.createElement('button');b.textContent=p.n;b.className=i===cur?'on':'';
b.onclick=function(){cur=i;pcts=plans[i].p.slice();[].forEach.call(t.querySelectorAll('button'),function(x,j){x.className=j===i?'on':''});
document.getElementById('pill').style.transform='translateX('+(i*100)+'%)';buildRows();calc()};t.appendChild(b)})}
function buildChips(){
var c=document.getElementById('chips');
[1000,5000,10000,25000,50000,100000].forEach(function(v){var b=document.createElement('button');b.className='chip';b.textContent=inr(v);
b.onclick=function(){f.value=v;calc()};c.appendChild(b)})}
function buildRows(){
var r=document.getElementById('rows');r.innerHTML='';
document.getElementById('cnt').textContent=pcts.length+' levels';
pcts.forEach(function(p,i){
var d=document.createElement('div');d.className='row';d.style.setProperty('--i',i);
var h=hue(i);
d.innerHTML='<div class="l1"><span class="badge" style="background:linear-gradient(135deg,hsl('+h+' 80% 58%),hsl('+(h+25)+' 85% 55%))">Level '+(i+1)+'</span><input class="pc" type="number" step="0.01" inputmode="decimal" value="'+p+'" data-i="'+i+'"><span class="amt">₹0</span></div><div class="bar"><i style="background:linear-gradient(90deg,hsl('+h+' 80% 62%),hsl('+(h+25)+' 85% 58%))"></i></div>';
r.appendChild(d)});
[].forEach.call(r.querySelectorAll('.pc'),function(x){x.oninput=function(){pcts[+x.dataset.i]=parseFloat(x.value)||0;calc()}})}
function calc(){
var fund=parseFloat(f.value)||0,tot=0,max=Math.max.apply(null,pcts.concat([0.0001]));
var rs=document.querySelectorAll('#rows .row');
pcts.forEach(function(p,i){
var a=fund*p/100;tot+=a;
setTimeout(function(){rs[i].querySelector('.bar i').style.width=(p/max*100)+'%'},60);
tween(rs[i].querySelector('.amt'),a,inr)});
var tp=pcts.reduce(function(s,x){return s+x},0);
tween(document.getElementById('tp'),tp,function(v){return (Math.round(v*100)/100)+'%'});
tween(document.getElementById('tu'),tot,inr);
tween(document.getElementById('rm'),fund-tot,inr);
document.getElementById('pg').style.strokeDashoffset=326.7*(1-Math.min(Math.max(tp,0),100)/100)}
f.oninput=calc;
buildTabs();buildChips();buildRows();calc();
</script>
</body>
</html>
